# Local mode (development and tests): plain HTTP on one port, and a mail catcher so login
# codes can be read without SMTP credentials.
services:
  caddy:
    ports:
      - "${BIND_ADDRESS}:${WEB_PORT:-8480}:80"

  mailpit:
    image: axllent/mailpit:v1.29
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"   # web UI and API, this machine only
