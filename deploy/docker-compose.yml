# TeamTAK: the full stack. Started by install.sh, which generates deploy/.env and
# everything under deploy/data/ (both git-ignored). Two more files are added through
# COMPOSE_FILE in .env:
#   docker-compose.production.yml   public ports 80/443, Let's Encrypt
#   docker-compose.local.yml        plain HTTP on localhost, mail catcher
#   data/docker-compose.ports.yml   the TAK client ports and the port of TAK Server's
#                                   administration, generated from TAK_CLIENT_PORTS and
#                                   TAK_ADMIN_PORT
#
# Published ports: web (Caddy), the TAK client ports (TAK_CLIENT_PORTS, 8089 by default),
# 8446 (TAK enrollment) and TAK_ADMIN_PORT (8443 by default: Caddy serves TAK Server's
# administration pages there, to the platform's administrators once signed in).
# TAK Server's own 8443 (API) is NOT published: the platform and Caddy reach it over the
# Docker network.
#
# The host agent is the only service that holds the Docker socket. It sits alone on a
# network without any way out ("agent"), which only the platform also joins.
name: teamtak

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${PUBLIC_HOST}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./caddy/Caddyfile.${MODE}:/etc/caddy/Caddyfile:ro
      # TAK Server's administration pages: the site, and the certificate it presents to TAK
      # Server (written by install.sh).
      - ./caddy/tak-admin.caddy:/etc/caddy/tak-admin.caddy:ro
      - ./data/caddy/tak-admin:/etc/caddy/tak-admin:ro
      # Bind mount: in production, scripts/sync-letsencrypt.sh reads the certificate here.
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config

  app:
    # TEAMTAK_VERSION: written into .env by install.sh at every run, from git.
    image: teamtak/app:${TEAMTAK_VERSION:-local}
    build:
      context: ..
      dockerfile: deploy/app/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      openldap:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://teamtak:${POSTGRES_PASSWORD}@postgres:5432/teamtak
      APP_SECRET: ${APP_SECRET}
      PUBLIC_URL: ${PUBLIC_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # E-mail (Brevo in production)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      MAIL_FROM: ${MAIL_FROM}
      # Directory
      LDAP_URL: ldap://openldap:389
      LDAP_BASE_DN: ${LDAP_BASE_DN}
      LDAP_BIND_DN: cn=teamtak,ou=Services,${LDAP_BASE_DN}
      LDAP_BIND_PASSWORD: ${LDAP_MANAGER_PW}
      # TAK Server, over the Docker network
      TAK_API_URL: https://takserver:8443
      TAK_ENROLL_URL: ${TAK_ENROLL_URL:-https://takserver:8446}
      TAK_CA_FILE: /data/tak/ca-chain.pem
      TAK_API_CERT_FILE: /data/tak/api-cert.pem
      TAK_API_KEY_FILE: /data/tak/api-key.pem
      TAK_API_CERT_NAME: ${TAK_API_CERT_NAME}
      TAK_ADMIN_UI_CERT_NAME: ${TAK_ADMIN_UI_CERT_NAME:-teamtak-admin-ui}
      TAK_ADMIN_UI_CERT_FILE: /data/tak/admin-ui-cert.pem
      # Port of TAK Server's administration pages (served by Caddy), for the link in the web UI
      TAK_ADMIN_PORT: ${TAK_ADMIN_PORT:-off}
      # What users are handed
      TAK_PUBLIC_HOST: ${PUBLIC_HOST}
      TAK_CLIENT_PORTS: ${TAK_CLIENT_PORTS:-8089}
      TAK_CONNECTION_NAME: ${TAK_CONNECTION_NAME:-TeamTAK}
      P12_FORMAT: ${P12_FORMAT:-modern}
      # Limits (defaults in the binary; see deploy/.env.example)
      DEFAULT_MEMBER_CAP: ${DEFAULT_MEMBER_CAP:-10}
      LOGIN_MAX_CODES_PER_EMAIL: ${LOGIN_MAX_CODES_PER_EMAIL:-5}
      LOGIN_MAX_CODES_PER_IP: ${LOGIN_MAX_CODES_PER_IP:-30}
      LOGIN_MAX_FAILURES_PER_IP: ${LOGIN_MAX_FAILURES_PER_IP:-30}
      RECONCILE_INTERVAL_SECONDS: ${RECONCILE_INTERVAL_SECONDS:-60}
      # Monitoring: the host agent, and how often the platform looks at everything
      AGENT_URL: http://agent:9300
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-60}
      # Where Caddy answers inside the network, to read the certificate it presents
      WEB_TLS_PROBE: ${WEB_TLS_PROBE:-caddy:443}
      # GitHub repository whose latest release is compared with this version (off: never asked)
      RELEASE_REPOSITORY: ${RELEASE_REPOSITORY:-}
    volumes:
      - ./data/app:/data:ro
    networks:
      - default
      - agent
    healthcheck:
      test: ["CMD", "/usr/local/bin/teamtak", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  agent:
    image: teamtak/agent:${TEAMTAK_VERSION:-local}
    build:
      context: ..
      dockerfile: deploy/agent/Dockerfile
    restart: unless-stopped
    environment:
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      AGENT_PROJECT: teamtak
    volumes:
      # The only Docker socket of the stack.
      - /var/run/docker.sock:/var/run/docker.sock
      # The machine, read-only, and no more of it than the report needs: the distribution
      # and its package sources (/etc), the package database and Docker's disk (/var/lib),
      # the "reboot required" flag (/run).
      - /etc:/host/etc:ro
      - /var/lib:/host/var/lib:ro
      - /run:/host/run:ro
      # The repository, read-only: the scripts the agent runs, deploy/.env and deploy/data
      # for the backups, the name of a TAK Server ZIP at its root.
      - ..:/repo:ro
      # Written by the agent: the backup archives, and under data/tak the keystore of the
      # Let's Encrypt hand-over and the housekeeping of TAK Server's logs.
      - ./backups:/repo/deploy/backups
      - ./data/tak:/repo/deploy/data/tak
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      # Read the files of the other services (certificates, settings), whoever owns them.
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    networks:
      - agent
    healthcheck:
      test: ["CMD", "/usr/local/bin/teamtak-agent", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 5s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: teamtak
      POSTGRES_USER: teamtak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamtak -d teamtak"]
      interval: 5s
      timeout: 5s
      retries: 20

  openldap:
    # Community image rebuilt weekly on debian:trixie-slim (slapd 2.6), amd64 + arm64.
    # Pinned by digest (tag 2.6.10 as of 2026-11-19): the two ACL/memberOf overrides below
    # rely on paths the image does not document.
    image: vegardit/openldap@sha256:f6e74dd8cb4bd7945d9c97e1127a87977ab3ae6fb3110d8dd5ac192e5c9cdd31
    restart: unless-stopped
    environment:
      LDAP_INIT_ORG_DN: ${LDAP_BASE_DN}
      LDAP_INIT_ORG_NAME: TeamTAK
      LDAP_INIT_ROOT_USER_DN: cn=admin,${LDAP_BASE_DN}
      LDAP_INIT_ROOT_USER_PW: ${LDAP_ROOT_PW}
      LDAP_INIT_PPOLICY_DEFAULT_DN: cn=DefaultPasswordPolicy,ou=Policies,${LDAP_BASE_DN}
      LDAP_INIT_ALLOW_CONFIG_ACCESS: "false"
      # No password-quality module: passwords are generated, never chosen.
      LDAP_PPOLICY_PPM_CONFIG: ""
      # Used by ldap/init_org_entries.ldif
      TM_LDAP_TAKSERVER_PW: ${LDAP_TAKSERVER_PW}
      TM_LDAP_MANAGER_PW: ${LDAP_MANAGER_PW}
    volumes:
      # Mount points supported by the image
      - ./ldap/init_org_tree.ldif:/opt/ldifs/init_org_tree.ldif:ro
      - ./ldap/init_org_entries.ldif:/opt/ldifs/init_org_entries.ldif:ro
      - ./ldap/init_org_ppolicy.ldif:/opt/ldifs/init_org_ppolicy.ldif:ro
      # Overrides the image does not document (memberOf on groupOfNames, ACLs)
      - ./ldap/init_module_memberof.ldif:/opt/ldifs/init_module_memberof.ldif:ro
      - ./ldap/init_mdb_acls.ldif:/opt/ldifs/init_mdb_acls.ldif:ro
      - ldap-config:/etc/ldap/slapd.d
      - ldap-data:/var/lib/ldap
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -b '' -s base namingContexts >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  takserver-db:
    image: ${TAK_DB_IMAGE}
    restart: unless-stopped
    environment:
      # Read by db-utils/takserver-setup-db.sh of the ZIP: password of martiuser
      envpass: ${TAK_DB_PASSWORD}
    volumes:
      - tak-db-data:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          # The image creates TAK Server's tables at startup with a tool that connects to
          # the host name written in the ZIP's example configuration: "tak-database".
          # Without this name the tables are never created.
          - tak-database
    healthcheck:
      # The image's own healthcheck passes as soon as PostgreSQL listens; here we wait for
      # the "cot" database, the martiuser role and TAK Server's tables.
      test: ["CMD-SHELL", "psql -U postgres -d cot -tAc \"select count(*) from pg_roles r, information_schema.tables t where r.rolname='martiuser' and t.table_name='certificate'\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  takserver:
    image: ${TAK_IMAGE}
    restart: unless-stopped
    depends_on:
      takserver-db:
        condition: service_healthy
      openldap:
        condition: service_healthy
    # Our entrypoint starts TAK Server as the image does, then exits if one of its five
    # processes dies, so that the restart policy brings it back.
    entrypoint: ["/bin/bash", "/opt/teamtak/entrypoint.sh"]
    environment:
      # Java heap sizes in MB. Empty: TAK Server sizes them from the machine's RAM.
      API_MAX_HEAP: ${TAK_API_MAX_HEAP:-}
      MESSAGING_MAX_HEAP: ${TAK_MESSAGING_MAX_HEAP:-}
      CONFIG_MAX_HEAP: ${TAK_CONFIG_MAX_HEAP:-}
      PLUGIN_MANAGER_MAX_HEAP: ${TAK_PLUGIN_MANAGER_MAX_HEAP:-}
      RETENTION_MAX_HEAP: ${TAK_RETENTION_MAX_HEAP:-}
    volumes:
      - ./takserver/entrypoint.sh:/opt/teamtak/entrypoint.sh:ro
      - ./takserver/healthcheck.sh:/opt/teamtak/healthcheck.sh:ro
      - ./data/tak/CoreConfig.xml:/opt/tak/CoreConfig.xml
      # Provided up front to avoid a race on first start (phase 0 report, section 11)
      - ./data/tak/TAKIgniteConfig.xml:/opt/tak/TAKIgniteConfig.xml
      # Holds the administrator role of the platform's API certificate
      - ./data/tak/UserAuthenticationFile.xml:/opt/tak/UserAuthenticationFile.xml
      - ./data/tak/certs:/opt/tak/certs/files
      - ./data/tak/logs:/opt/tak/logs
    ports:
      # TAK clients (mutual TLS) reach 8089 through the ports of data/docker-compose.ports.yml.
      - "${BIND_ADDRESS}:8446:8446"   # enrollment (username + password)
    networks:
      default:
        aliases:
          # The name carried by a Let's Encrypt certificate on 8446, so the platform can
          # verify it from inside the network.
          - ${TAK_NETWORK_ALIAS:-takserver.internal}
    healthcheck:
      test: ["CMD", "/bin/bash", "/opt/teamtak/healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 180s

networks:
  # Platform <-> agent only. "internal": no route to the outside, in either direction.
  agent:
    internal: true

volumes:
  postgres-data:
  ldap-config:
  ldap-data:
  tak-db-data:
