[package]
name = "teamtak-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The host agent: the only component that sees the host and the Docker socket. It is kept
# small on purpose: no database, no outgoing connection, a fixed list of things it can do.
# The library part holds the report it produces, so the server reads it with the same types.

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
clap = { version = "4.6.8", features = ["derive", "env"] }
flate2 = "1.1.11"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
time = { version = "0.3.55", features = ["macros"] }

[lib]
name = "teamtak_agent"
path = "src/lib.rs"

[[bin]]
name = "teamtak-agent"
path = "src/main.rs"
