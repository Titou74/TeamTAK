[package]
name = "teamtak-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.11.1"
async-trait = "0.1.92"
base64 = "0.23.1"
hex = "0.4.3"
hmac = "0.13.0"
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
p12-keystore = "0.4.1"
rand = "0.10.4"
rcgen = "0.14.10"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rsa = "0.10.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.16.0", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
webpki-roots = "1.0.12"
x509-parser = "0.18.1"
zip = { version = "9.7.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
time = { version = "0.3.55", features = ["macros"] }
