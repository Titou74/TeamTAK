[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "crates/agent"]

[workspace.package]
version = "1.3.1"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/Titou74/TeamTAK"
publish = false

# Keep the debug build small (disk is tight) and make RSA key generation usable in tests.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
strip = true
